name: Baiboly sy Fihirana FJM

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  APK_FILE: Baiboly-sy-Fihirana-FJM.apk

jobs:
  # ---------- Site (GitHub Pages) — mila Settings → Pages → Source = GitHub Actions ----------
  site:
    runs-on: ubuntu-24.04
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node build.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deploy
        uses: actions/deploy-pages@v4

  # ---------- APK + GitHub Release ----------
  apk:
    name: APK + Release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - name: Install + build web (dist) + add Android
        run: |
          npm install --no-audit --no-fund
          node build.js
          npx cap add android
          # Firebase (fanairana push): mila google-services.json eo amin'ny root
          test -f google-services.json && cp google-services.json android/app/google-services.json || echo "::warning::Tsy misy google-services.json → tsy hisy push"

      # Kisary + splash avy amin'ny assets/ (icon-only.png, icon-foreground.png, splash.png)
      - name: Generate icons and splash
        run: |
          npx @capacitor/assets generate --android --assetPath assets \
            --iconBackgroundColor "#c41016" --iconBackgroundColorDark "#c41016" \
            --splashBackgroundColor "#ffffff" --splashBackgroundColorDark "#ffffff"
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || { echo "::error::Tsy namoaka kisary"; exit 1; }
          test -n "$(find android/app/src/main/res -path '*drawable*' -name 'splash.png' | head -1)" || { echo "::error::Tsy namoaka splash"; exit 1; }

      - name: Sync Capacitor
        run: npx cap sync android

      # Bara ambany (navigation bar): plugin kely "NavBar" ampiasain'ny index.html mba hanarahana ny loko + theme
      - name: Android customization (nav bar, splash theme, version)
        run: |
          set -e
          APPID=$(node -p "require('./capacitor.config.json').appId")
          JAVA_DIR=android/app/src/main/java/$(echo "$APPID" | tr . /)
          RES=android/app/src/main/res/values
          cat > "$JAVA_DIR/NavBar.java" <<EOF
          package $APPID;
          import android.graphics.Color;
          import android.os.Build;
          import android.view.View;
          import android.view.Window;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          @CapacitorPlugin(name = "NavBar")
          public class NavBar extends Plugin {
            @PluginMethod
            public void setColor(final PluginCall call) {
              final String c = call.getString("color", "#000000");
              final boolean light = Boolean.TRUE.equals(call.getBoolean("light", false));
              getActivity().runOnUiThread(() -> {
                try {
                  Window w = getActivity().getWindow();
                  w.setNavigationBarColor(Color.parseColor(c));
                  if (Build.VERSION.SDK_INT >= 29) w.setNavigationBarContrastEnforced(false);
                  View d = w.getDecorView();
                  int f = d.getSystemUiVisibility();
                  f = light ? (f | View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR) : (f & ~View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR);
                  d.setSystemUiVisibility(f);
                  call.resolve();
                } catch (Exception e) { call.reject(String.valueOf(e.getMessage())); }
              });
            }
          }
          EOF
          cat > "$JAVA_DIR/MainActivity.java" <<EOF
          package $APPID;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(NavBar.class);
              super.onCreate(savedInstanceState);
            }
          }
          EOF
          # (heredoc indenté → esorina ny elanelana eo am-boalohany)
          sed -i 's/^          //' "$JAVA_DIR/NavBar.java" "$JAVA_DIR/MainActivity.java"
          cat > $RES/fjm.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <color name="fjmSplashBg">#ffffff</color>
            <color name="fjmNavBar">#050816</color>
            <color name="fjmIconBg">#c41016</color>
          </resources>
          EOF
          sed -i 's/^          //' $RES/fjm.xml
          # Kisary mihetsika: ny background dia loko (tsy sary) → misoroka "mipmap/ic_launcher_background not found"
          for f in android/app/src/main/res/mipmap-anydpi-v26/*.xml; do
            [ -f "$f" ] && sed -i 's#@mipmap/ic_launcher_background#@color/fjmIconBg#g; s#@color/ic_launcher_background#@color/fjmIconBg#g' "$f" && echo "patched $f" && cat "$f"
          done
          python3 - <<'PY'
          import re
          p = "android/app/src/main/res/values/styles.xml"
          t = open(p).read()
          t = t.replace('</style>', '        <item name="android:navigationBarColor">@color/fjmNavBar</item>\n    </style>', 1) if 'navigationBarColor' not in t else t
          launch = '        <item name="windowSplashScreenBackground">@color/fjmSplashBg</item>\n        <item name="windowSplashScreenAnimatedIcon">@mipmap/ic_launcher_foreground</item>\n        <item name="postSplashScreenTheme">@style/AppTheme.NoActionBar</item>\n'
          t = re.sub(r'(<style name="AppTheme\.NoActionBarLaunch"[^>]*>)', lambda m: m.group(1) + '\n' + launch, t, count=1)
          open(p, "w").write(t)
          PY
          F=android/app/build.gradle
          V=$(node -p "require('./package.json').version")
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" $F
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"$V.${{ github.run_number }}\"/" $F
          echo "$V" > version.txt
          cat android/app/src/main/res/values/styles.xml

      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew && mkdir -p ../out
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > ../release.keystore
            ./gradlew assembleRelease --no-daemon --console=plain 2>&1 | tee ../gradle.log; R=${PIPESTATUS[0]}
            if [ $R -ne 0 ]; then grep -E "error:|What went wrong|Execution failed|not found|FAILED" -A4 ../gradle.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; fi
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            "$BT/zipalign" -p -f 4 "$(find app/build/outputs/apk/release -name '*.apk' | head -1)" ../out/aligned.apk
            "$BT/apksigner" sign --ks ../release.keystore --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out "../out/$APK_FILE" ../out/aligned.apk
            rm -f ../out/aligned.apk ../release.keystore
          else
            echo "::warning::Tsy misy KEYSTORE (secrets) → APK debug (tsy azo havaozina eo ambonin'ny teo aloha). Jereo README.md."
            ./gradlew assembleDebug --no-daemon --console=plain 2>&1 | tee ../gradle.log; R=${PIPESTATUS[0]}
            if [ $R -ne 0 ]; then grep -E "error:|What went wrong|Execution failed|not found|FAILED" -A4 ../gradle.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; fi
            cp "$(find app/build/outputs/apk/debug -name '*.apk' | head -1)" "../out/$APK_FILE"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Baiboly sy Fihirana FJM · build ${{ github.run_number }}
          body: "**Baiboly sy Fihirana FJM** — APK Android (build ${{ github.run_number }}). Alaivo ny rakitra `${{ env.APK_FILE }}` ary apetraho ao amin'ny finday."
          files: out/${{ env.APK_FILE }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
